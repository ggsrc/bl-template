version: 1.0.0

# Global parameter definitions for the terraform module
# These parameters apply to every component under the terraform module
# Validation rules follow the official GCP documentation

parameters:
  # Terraform-level global parameters
  global:
    TerraformBackendBucket:
      type: string
      description: "GCS bucket name for Terraform backend; 3-63 chars, lowercase/numbers/dashes/underscores, must start and end with letter or number"
      required: false
      default: "terraform-statestore"
      validation:
        - kind: stringLength
          min: 3
          max: 63
          message: "GCS bucket name must be 3-63 characters long"
        - kind: pattern
          value: "^[a-z0-9][a-z0-9._-]{1,61}[a-z0-9]$"
          message: "GCS bucket name: lowercase letters, digits and ._- only, 3-63 characters, starting and ending with a letter or digit"
      example: "terraform-statestore"

    TerraformVersion:
      type: string
      description: "Terraform version to use"
      required: false
      default: "1.5.0"
      example: "1.5.0"

    OrganizationID:
      type: string
      description: "GCP Organization ID (numeric). Set to \"0\" to disable org_id rendering in templates."
      required: false
      default: "0"
      validation:
        - kind: format
          value: numeric
          message: "Organization ID must be numeric"
        - kind: pattern
          value: "^[0-9]+$"
      example: "123456789012"

    BillingAccountID:
      type: string
      description: "GCP Billing Account ID; 18 alphanumeric chars, format like 01ABCD-2EFGH3-4IJKL5"
      required: true
      validation:
        - kind: required
        - kind: pattern
          value: "^[0-9A-Z]{6}-[0-9A-Z]{6}-[0-9A-Z]{6}$"
          message: "Billing Account ID must be three groups of 6 digits or uppercase letters, e.g. 01ABCD-2EFGH3-4IJKL5"
      example: "01ABCD-2EFGH3-4IJKL5"

    GlobalName:
      type: string
      description: "Global name used for resource naming (e.g., for backend bucket); RFC 1035 style, 1-63 chars"
      required: true
      validation:
        - kind: required
        - kind: stringLength
          min: 1
          max: 63
          message: "Resource name must be 1-63 characters long"
        - kind: pattern
          value: "^[a-z]([-a-z0-9]*[a-z0-9])?$"
          message: "Must start with a lowercase letter and contain only lowercase letters, digits and hyphens"
      example: "my-org"

