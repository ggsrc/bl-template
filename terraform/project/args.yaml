version: 1.0.0

# Project-level global parameter definitions for the terraform/project directory
# These parameters apply to every component under the project directory
# project_name is the logical name (e.g. prd, stg) used for resource naming and locals; the GCP project ID comes from project_id

parameters:
  # Project-level global parameters
  global:
    project_name:
      type: string
      description: "Project logical name (e.g. prd, stg); used for resource naming, locals; not sent to GCP"
      required: true
      validation:
        - kind: required
        - kind: stringLength
          min: 2
          max: 30
          message: "project_name must be 2-30 characters long"
        - kind: pattern
          value: "^[a-z0-9][a-z0-9-]*[a-z0-9]$"
          message: "project_name: lowercase letters, digits and hyphens only, starting and ending with a letter or digit"
      example: "prd"

    project_id:
      type: string
      description: "GCP Project ID (filled by init-args; must be 6-30 chars, globally unique)"
      required: false
      validation:
        - kind: stringLength
          min: 6
          max: 30
          message: "GCP Project ID must be 6-30 characters long"
        - kind: pattern
          value: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$"
          message: "GCP Project ID: lowercase letters, digits and hyphens only, starting with a letter and ending with a letter or digit"
      example: "my-org-prd-abc123"

    region:
      type: string
      description: "Default GCP region for this project"
      required: false
      default: "us-west1"
      enum: ["us-west1", "us-west2", "us-west3", "us-west4", "us-east1", "us-east4", "us-central1", "asia-east1", "asia-northeast1", "europe-west1"]
      validation:
        - kind: enum
          values: ["us-west1", "us-west2", "us-west3", "us-west4", "us-east1", "us-east4", "us-central1", "asia-east1", "asia-northeast1", "europe-west1"]
      example: "us-west1"

    domain:
      type: string
      description: "Optional primary domain for this project (exposed in locals)"
      required: false
      example: "prd.example.com"
