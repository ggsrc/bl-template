version: 1.0.0

# Parameter definitions for the terraform/project/ip component
# Declares reserved global and internal IP addresses for use by DNS, cert, CDN, load balancers, etc.

parameters:
  components:
    ip:
      # Global external IP addresses (LB, Gateway, CDN, etc.)
      global_addresses:
        type: array
        description: "List of global external IP addresses to reserve"
        required: false
        default: []
        items:
          type: object
          properties:
            name:
              type: string
              description: "Resource name (GCP and Terraform identifier; use letters, digits, hyphens)"
              example: "app"
            purpose:
              type: string
              description: "Optional purpose (e.g. GCE_ENDPOINT, VPC_PEERING)"
              required: false
            address_type:
              type: string
              description: "EXTERNAL or INTERNAL"
              required: false
              default: "EXTERNAL"
      # Internal IP addresses (a subnetwork is required)
      internal_addresses:
        type: array
        description: "List of internal IP addresses (require subnetwork reference)"
        required: false
        default: []
        items:
          type: object
          properties:
            name:
              type: string
              description: "Resource name"
              example: "tempoip"
            subnetwork:
              type: string
              description: "Subnetwork reference, e.g. google_compute_subnetwork.default.id"
              example: "google_compute_subnetwork.default.id"
            region:
              type: string
              description: "Region for the address (optional if subnetwork is region-scoped)"
              required: false
      # Addresses to output for use by DNS/cert (output names must be valid identifiers; underscores are recommended)
      output_addresses:
        type: array
        description: "List of { resource_name, output_name } to expose as outputs"
        required: false
        default: []
        items:
          type: object
          properties:
            resource_name:
              type: string
              description: "Terraform resource name (google_compute_global_address.<this>)"
              example: "corp-ip-whitelist"
            output_name:
              type: string
              description: "Output name (use underscores, e.g. corp_ip_whitelist_address)"
              example: "corp_ip_whitelist_address"
