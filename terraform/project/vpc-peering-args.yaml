version: 1.0.0

# Parameters for the terraform/project/vpc-peering component
# Declares VPC peering; with cross-project dependencies blcli writes it to a subdirectory, which is moved back to the project root after apply

parameters:
  components:
    vpc-peering:
      vpc_peerings:
        type: array
        description: "List of VPC peering connections"
        required: false
        items:
          type: object
          properties:
            name:
              type: string
              description: "Name of the VPC peering connection"
              required: true
            peer_network:
              type: string
              description: "Full URL of the peer network (e.g., https://www.googleapis.com/compute/v1/projects/PROJECT_ID/global/networks/NETWORK_NAME)"
              required: true
            export_custom_routes:
              type: boolean
              description: "Export custom routes to peer network"
              required: false
              default: true
            import_custom_routes:
              type: boolean
              description: "Import custom routes from peer network"
              required: false
              default: true
