version: 1.0.0

# Parameter definitions for the terraform/project/cert component
# These parameters create SSL certificates, a Certificate Map and Certificate Map Entries

parameters:
  # Component-level parameters (the cert component under projects in config.yaml)
  components:
    cert:
      certificates:
        type: array
        description: "List of SSL certificates to create using ssl-certificate module"
        required: false
        items:
          type: object
          properties:
            name:
              type: string
              description: "Certificate name (used as module identifier)"
              required: true
              pattern: "^[a-z0-9-]+$"
              example: "corp_cert"
            component_name:
              type: string
              description: "Component name for the certificate"
              required: true
              example: "corp"
            domain:
              type: string
              description: "Domain name for the certificate"
              required: true
              example: "corp.example.com"
            dns_zone_name:
              type: string
              description: "Name of the DNS managed zone (must match name in dns component)"
              required: false
              example: "public"
            dns_zone_reference:
              type: string
              description: "Alternative DNS zone reference (e.g., google_dns_managed_zone.public.managed_zone_id)"
              required: false
            zone_project:
              type: string
              description: "Project ID for the DNS zone (defaults to var.project_id if not specified)"
              required: false
              example: "my-project-123"
      
      # DNS authorization + certificate only (no DNS records are created; add the CNAME in your external DNS)
      dns_authorization_certificates:
        type: array
        description: "Certificates using DNS authorization only (external DNS); no google_dns_record_set created"
        required: false
        default: []
        items:
          type: object
          properties:
            name:
              type: string
              description: "Terraform resource name (e.g. example_com); used in certificate_map_entries"
              pattern: "^[a-z0-9_]+$"
              example: "example_com"
            dns_authorization_name:
              type: string
              description: "GCP resource name for the DNS authorization"
              example: "app-example-com"
            domain:
              type: string
              description: "Domain for DNS authorization"
              example: "example.com"
            managed_domains:
              type: array
              description: "Domains for the managed certificate (e.g. [example.com, *.example.com])"
              items:
                type: string
              example: ["example.com", "*.example.com"]
            description:
              type: string
              required: false

      certificate_maps:
        type: array
        description: "List of certificate maps to create"
        required: false
        items:
          type: object
          properties:
            name:
              type: string
              description: "Certificate map name"
              required: true
              pattern: "^[a-z0-9-]+$"
              example: "main_gateway_map"
            description:
              type: string
              description: "Description of the certificate map"
              required: false
              example: "Main gateway certificate map"
            labels:
              type: object
              description: "Labels for the certificate map"
              required: false
              additionalProperties:
                type: string
      
      certificate_map_entries:
        type: array
        description: "List of certificate map entries to create"
        required: false
        items:
          type: object
          properties:
            name:
              type: string
              description: "Certificate map entry name"
              required: true
              pattern: "^[a-z0-9-]+$"
              example: "wildcard_entry"
            map_name:
              type: string
              description: "Name of the certificate map (must match name in certificate_maps)"
              required: true
              example: "main_gateway_map"
            hostname:
              type: string
              description: "Hostname pattern (e.g., '*.example.com')"
              required: true
              example: "*.example.com"
            certificates:
              type: array
              description: "List of certificate names for module certs (module.<name>_cert.cert_id); use certificate_refs to mix module and dns_authorization certs"
              required: false
              items:
                type: string
              example: ["corp_cert"]
            certificate_refs:
              type: array
              description: "Explicit refs: { type: module|resource, name } - resource = google_certificate_manager_certificate.<name>.id"
              required: false
              items:
                type: object
                properties:
                  type:
                    type: string
                    enum: ["module", "resource"]
                  name:
                    type: string
            description:
              type: string
              description: "Description of the certificate map entry"
              required: false
            matcher:
              type: string
              description: "Matcher for the certificate map entry"
              required: false
              enum: ["PRIMARY", "STORED"]
              example: "PRIMARY"

