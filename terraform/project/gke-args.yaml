version: 1.0.0

# Parameter definitions for the terraform/project/gke component
# These parameters create a GKE cluster

parameters:
  # Component-level parameters (the gke component under projects in config.yaml)
  components:
    gke:
      project_id:
        type: string
        description: "GCP Project ID where the GKE cluster will be created"
        required: true
        example: "my-project-123"
      
      clusterName:
        type: string
        description: "Name of the GKE cluster"
        required: false
        pattern: "^[a-z0-9-]+$"
        example: "my-cluster"
      
      network:
        type: string
        description: "Name of the VPC network"
        required: false
        default: "default"
        example: "default"
      
      subnetwork:
        type: string
        description: "Name of the VPC subnetwork"
        required: false
        default: "default"
        example: "default"
      
      clusterIpv4CidrBlock:
        type: string
        description: "CIDR block for the GKE cluster pods"
        required: false
        default: "10.0.0.0/14"
        example: "10.0.0.0/14"
      
      servicesIpv4CidrBlock:
        type: string
        description: "CIDR block for the GKE cluster services"
        required: false
        default: "10.4.0.0/19"
        example: "10.4.0.0/19"
      
      masterIpv4CidrBlock:
        type: string
        description: "Reserved for the private control-plane CIDR. NOT applied today: the module does not create a private_cluster_config, and wiring it would force cluster recreation. Leave it unset unless you add a private control-plane block to the gke module."
        required: false
        default: "172.16.0.0/28"
        example: "172.16.0.0/28"
      
      nodeLocations:
        type: array
        description: "List of GCP zones for node placement"
        required: false
        default: ["us-west1-a"]
        example: ["us-west1-a"]
      
      machineType:
        type: string
        description: "Machine type for GKE nodes"
        required: false
        default: "e2-medium"
        example: "e2-medium"
      
      diskSizeGb:
        type: integer
        description: "Boot disk size in GB for the main node pool"
        required: false
        default: 20
        example: 20
      
      minNodeCount:
        type: integer
        description: "Minimum number of nodes in the node pool"
        required: false
        default: 1
        example: 1
      
      maxNodeCount:
        type: integer
        description: "Maximum number of nodes in the node pool"
        required: false
        default: 50
        example: 50
      
      initialNodeCount:
        type: integer
        description: "Initial number of nodes in the node pool"
        required: false
        default: 1
        example: 1
      
      loggingConfigEnableComponents:
        type: array
        description: "List of logging components to enable"
        required: false
        default: []
        example: []
      
      monitoringConfigEnableComponents:
        type: array
        description: "List of monitoring components to enable"
        required: false
        default: ["SYSTEM_COMPONENTS"]
        example: ["SYSTEM_COMPONENTS"]
      
      managedPrometheusEnabled:
        type: boolean
        description: "Enable managed Prometheus"
        required: false
        default: false
        example: false
      
      totalMinNodeCount:
        type: integer
        description: "Total minimum node count across all node pools"
        required: false
        example: 1
      
      totalMaxNodeCount:
        type: integer
        description: "Total maximum node count across all node pools"
        required: false
        example: 100
      
      locationPolicy:
        type: string
        description: "Location policy for node placement"
        required: false
        default: "BALANCED"
        enum: ["BALANCED", "ANY"]
        example: "BALANCED"
      
      releaseChannel:
        type: string
        description: "GKE release channel"
        required: false
        default: "EXTENDED"
        enum: ["RAPID", "REGULAR", "STABLE", "EXTENDED"]
        example: "EXTENDED"
      
      deletionProtection:
        type: boolean
        description: "Enable deletion protection for the cluster"
        required: false
        default: true
        example: true

      datapathProvider:
        type: string
        description: "GKE datapath provider. ADVANCED_DATAPATH (Dataplane V2) enforces NetworkPolicy natively and is the default for new clusters; LEGACY_DATAPATH keeps the old datapath and does not enforce NetworkPolicy unless networkPolicyEnabled is true. Changing this recreates the cluster (ForceNew): existing legacy clusters must set LEGACY_DATAPATH."
        required: false
        default: "ADVANCED_DATAPATH"
        enum: ["ADVANCED_DATAPATH", "LEGACY_DATAPATH"]
        example: "ADVANCED_DATAPATH"

      networkPolicyEnabled:
        type: boolean
        description: "Enable Calico NetworkPolicy enforcement. Only applies with datapathProvider LEGACY_DATAPATH; Dataplane V2 rejects it. Enabling it on an existing legacy cluster updates the cluster in place, but GKE enforces network policy only on node pools recreated afterwards."
        required: false
        default: false
        example: false

      masterAuthorizedNetworks:
        type: array
        description: "CIDR ranges allowed to reach the public control-plane endpoint. Empty (default) renders no master_authorized_networks_config block, so the control plane stays reachable from any IP (behavior unchanged). When non-empty, the module renders the allowlist and disables Google public CIDR access; node IPs are always allowed. In-place change."
        required: false
        default: []
        items:
          type: object
          properties:
            cidrBlock:
              type: string
              description: "CIDR range allowed to reach the control plane, e.g. 203.0.113.0/24"
              required: true
            displayName:
              type: string
              description: "Human-readable label; defaults to the CIDR itself"
              required: false
        example:
          - cidrBlock: "203.0.113.0/24"
            displayName: "office"

      enableSecureBoot:
        type: boolean
        description: "Enable Secure Boot on the node VMs. Default true. Changing this replaces the node pools (ForceNew). Set false only to keep existing nodes unchanged."
        required: false
        default: true
        example: true

      smAccessorSecretIdPrefix:
        type: string
        description: "Optional. Limit the External Secrets service account (sa-sm-accessor) to Secret Manager secrets whose ID starts with this prefix. Empty (default) keeps read access to every secret in the project."
        required: false
        default: ""
      
      nodePools:
        type: array
        description: "List of node pools to create"
        required: false
        default: []
        items:
          type: object
          properties:
            name:
              type: string
              description: "Node pool name"
              required: true
            machineType:
              type: string
              description: "Machine type for the node pool"
              required: true
            minNodes:
              type: integer
              description: "Minimum number of nodes"
              required: true
            maxNodes:
              type: integer
              description: "Maximum number of nodes"
              required: true
            nodeLocations:
              type: array
              description: "List of zones for node placement"
              required: false
            taints:
              type: array
              description: "List of taints for the node pool"
              required: false
              items:
                type: object
                properties:
                  key:
                    type: string
                    required: true
                  value:
                    type: string
                    required: true
                  effect:
                    type: string
                    required: true
            labels:
              type: object
              description: "Labels for the node pool"
              required: false
            spot:
              type: boolean
              description: "Use spot VMs"
              required: false
              default: false
