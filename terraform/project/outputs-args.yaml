version: 1.0.0

# Parameter definitions for the terraform/project/outputs component
# Controls which certificate maps, Gateway IPs, GKE details, etc. are output for the Kubernetes Gateway and external DNS

parameters:
  components:
    outputs:
      # Certificate Maps (id/name) to output for use by the Gateway/LB
      certificate_maps:
        type: array
        description: "List of certificate maps to output (id and name)"
        required: false
        default: []
        items:
          type: object
          properties:
            map_name:
              type: string
              description: "Certificate map resource name (must match cert component)"
              example: "main"
            output_prefix:
              type: string
              description: "Prefix for output names (e.g. app -> app_certificate_map_id)"
              example: "app"
      # CNAME records for external DNS (from cert dns_authorization), to add in your public DNS
      external_dns_records:
        type: array
        description: "Output dns_resource_record for dns_authorization certs (add CNAME in external DNS)"
        required: false
        default: []
        items:
          type: object
          properties:
            dns_authorization_name:
              type: string
              description: "Terraform resource name of google_certificate_manager_dns_authorization"
              example: "example_com"
            output_name:
              type: string
              description: "Output variable name (e.g. example_com_dns_record)"
              example: "example_com_dns_record"
            cert_id_output_name:
              type: string
              description: "Optional output name for certificate ID (e.g. example_com_cert_id)"
              required: false
      # Whether to output the GKE cluster endpoint and cluster_name
      gke:
        type: object
        description: "Output GKE cluster info (endpoint, cluster_name)"
        required: false
        properties:
          output_endpoint:
            type: boolean
            default: true
          output_cluster_name:
            type: boolean
            default: true
          module_name:
            type: string
            description: "GKE module name (default gke)"
            default: "gke"
