# Default: one GCP project (prd) - the smallest production-shaped setup.
# Growing to stg / prd / corp with VPC peering and shared services? See examples/multi-env/.
version: 1.0.0
global:
    BillingAccountID: 01ABCD-2EFGH3-4IJKL5
    OrganizationID: "0"
    TerraformBackendBucket: tfstore
    TerraformVersion: 1.5.0
init:
    components:
        backend: {}
        projects:
            ProjectServices:
                ${project.prd.id}:
                    - compute.googleapis.com
                    - container.googleapis.com
                    - iamcredentials.googleapis.com
                    - dns.googleapis.com
                    - servicenetworking.googleapis.com
                    - certificatemanager.googleapis.com
                    - secretmanager.googleapis.com
                    - iap.googleapis.com
                    - cloudidentity.googleapis.com
                    - serviceusage.googleapis.com
                    - networkmanagement.googleapis.com
                    - logging.googleapis.com
                    - cloudresourcemanager.googleapis.com
                    - artifactregistry.googleapis.com
projects:
    # prd: production environment, with the Kubernetes cluster and production workloads
    # Required: main (provides locals), provider, variables, vpc; for workloads: gke, ip, dns, cert, artifacts-registry, outputs
    # Add firewall, iam, cdn, loki-logs as needed; vpc-peering only once several environments must reach each other.
    - name: prd
      global:
        project_name: prd
        region: us-west1
        domain: prd.example.com
      components:
        - name: main
          parameters: {}
        - name: backend
          parameters: {}
        - name: config-gcs-tfbackend
          parameters: {}
        - name: provider
          parameters: {}
        - name: variables
          parameters:
            zone: us-west1-a
        - name: vpc
          parameters:
            auto_create_subnetworks: false
            enable_nat: true
            enable_private_pool_route: true
            enable_private_service_networking: false
            ip_cidr_range: 10.12.0.0/16
            nat_ip_name: gke-egress-router-nat-ip
            nat_log_enable: false
            nat_log_filter: ERRORS_ONLY
            nat_name: gke-egress-router-nat
            nat_router_name: gke-egress-router
            nat_source_subnetworks: ALL_SUBNETWORKS_ALL_IP_RANGES
            private_conn_ip_name: private-conn-alloc
            private_conn_prefix_length: 16
            private_pool_route_name: route-private-pool-to-internet-via-nat
            private_pool_route_priority: 900
            private_pool_tags:
                - gke-private-nat-pool
            routing_mode: REGIONAL
            subnetwork_name: us-west-1
            subnetworks: []
            vpc_name: app
        - name: ip
          parameters:
            global_addresses:
                - name: app
                  address_type: EXTERNAL
            output_addresses:
                - resource_name: app
                  output_name: gateway_ip
        - name: gke
          parameters:
              clusterName: prd-cluster
              network: app
              subnetwork: us-west-1
              clusterIpv4CidrBlock: 10.36.0.0/14
              servicesIpv4CidrBlock: 10.40.0.0/19
              masterIpv4CidrBlock: 172.16.0.0/28
              nodeLocations:
                  - us-west1-a
              diskSizeGb: 20
              machineType: e2-small
              minNodeCount: 1
              maxNodeCount: 50
              initialNodeCount: 1
              loggingConfigEnableComponents: []
              monitoringConfigEnableComponents:
                  - SYSTEM_COMPONENTS
              managedPrometheusEnabled: false
              locationPolicy: BALANCED
              releaseChannel: EXTENDED
              deletionProtection: true
              datapathProvider: ADVANCED_DATAPATH
              networkPolicyEnabled: false
              masterAuthorizedNetworks: []
              enableSecureBoot: true
              nodePools:
                  - name: on-demand
                    machineType: e2-standard-8
                    minNodes: 0
                    maxNodes: 5
                    nodeLocations:
                        - us-west1-a
                    taints:
                        - key: nodepool
                          value: on-demand
                          effect: NO_SCHEDULE
                    labels:
                        nodepool: on-demand
                  - name: spotvm
                    machineType: e2-standard-8
                    minNodes: 0
                    maxNodes: 5
                    nodeLocations:
                        - us-west1-a
                    spot: true
                    taints:
                        - key: nodepool
                          value: spotvm
                          effect: NO_SCHEDULE
                    labels:
                        nodepool: spotvm
        - name: dns
          parameters:
            records: []
            zones:
                - name: prd
                  dns_name: prd.example.com.
                  description: Production DNS zone
                  visibility: public
                - name: prd_private
                  dns_name: prd.private.example.com.
                  description: Production private DNS zone
                  visibility: private
                  private_visibility_config:
                      networks:
                          - network_url: google_compute_network.main.id
        - name: cert
          parameters:
            certificates:
                - name: app
                  component_name: app
                  domain: prd.example.com
                  dns_zone_name: prd
                  zone_project: var.project_id
            certificate_maps:
                - name: app
                  description: main gateway certificate map
            certificate_map_entries:
                - name: app_main
                  map_name: app
                  hostname: prd.example.com
                  certificates: [app]
                  description: ""
                - name: app_subdomain
                  map_name: app
                  hostname: "*.prd.example.com"
                  certificates: [app]
                  description: ""
        - name: artifacts-registry
          parameters:
            repositories:
                - name: app-registry
                  repository_id: app-registry
                  description: Docker images for your applications
                  format: DOCKER
                  location: us-west1
                  docker_config:
                      immutable_tags: true
            iam_members:
                - name: repo_iam_prd
                  repository_name: app-registry
                  role: roles/artifactregistry.reader
                  member: serviceAccount:gke-node-sa@prd.iam.gserviceaccount.com
        - name: outputs
          parameters:
            certificate_maps:
                - map_name: app
                  output_prefix: app
            gke:
                output_endpoint: true
                output_cluster_name: true
                module_name: gke

    - name: tfstore
      marshalled: false
