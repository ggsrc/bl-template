# Default: one environment (prd) on one cluster - the smallest stack that is still production-shaped.
#   0  external-secrets-operator / external-secrets  secrets from GCP Secret Manager, never in Git
#   0  sealed-secret                                 encrypt the few secrets that must live in Git
#   2  argocd                                        GitOps: the cluster matches the gitops repo
#   3  victoria-metrics-operator                     metrics: scrape + store (VMSingle) + alert in-cluster
#   4  victoria-metrics / grafana                    alert rules and dashboards
#
# Not enabled by default (add under projects[].components when you need them):
#   istio - service mesh: mTLS, canary routing. Add it once you run several services;
#           also set VirtualServiceEnabled: true on your gitops apps.
#   cnpg, redis, paradedb, kafka, loki, otel-collector, n9e, uptrace, bytebase, juicefs, navigation
#   See kubernetes/OPTIONAL_COMPONENTS.md.
#
# Growing to stg / prd / corp with a central monitoring cluster? See examples/multi-env/.

version: 1.0.0
global: {}
projects:
  - name: prd
    components:
      - name: 0-external-secrets-operator
        parameters:
          namespace: external-secrets
          release-name: external-secrets
          replica-count: 1
          min-helm-version: "v3.18.4"
          min-kubectl-version: "1.24"
      - name: 0-external-secrets
        parameters:
          namespace: external-secrets
          project-id: prd
          secret-manager-service-account-email: sa-sm-accessor@prd.iam.gserviceaccount.com
          service-account-name: external-secrets-sa
          ClusterName: prd-cluster  # must match the GKE cluster name in terraform (Workload Identity)
      - name: 0-sealed-secret
        parameters:
          namespace: sealed-secret
      - name: 2-argocd
        parameters:
          namespace: argocd
          argocd-url: https://argocd.example.com
          argocd-version: v3.5.6
          # Simplest setup for one person or a small team; nothing to create on GitHub but a deploy key.
          # Sign in: built-in admin user (no SSO). ArgoCD generates the password:
          #   kubectl -n argocd port-forward svc/argocd-server 8080:443   -> https://localhost:8080
          #   kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d
          AdminEnabled: true
          # Repository access: one SSH deploy key. The install script generates <workspace>/keys/argocd_github
          # if it is missing; add argocd_github.pub to the gitops repository as a read-only deploy key.
          GitAuthMethod: ssh
          GitRepositoryURL: git@github.com:example-org/gitops.git  # your gitops repository
          # Growing team: GitHub App credentials + GitHub SSO (Dex) + RBAC, see examples/multi-env.
      - name: 3-victoria-metrics-operator
        parameters:
          namespace: monitoring-vm
          release-name: victoriametrics
          storage-mode: local  # VMSingle + VMAlert + Alertmanager in this cluster
          retention-period: 30d
          storage-size: 20Gi
          cluster: prd
          env: prd
          vmagent-cpu-limit: "1"
          vmagent-memory-limit: "1Gi"
          vmagent-cpu-request: "200m"
          vmagent-memory-request: "256Mi"
      - name: 4-victoria-metrics
        parameters:
          namespace: monitoring-vm
          alert-cluster: prd
      - name: 4-grafana
        parameters:
          namespace: grafana
          release-name: grafana
          image-tag: "12.4.13"
          vm-datasource-url: "http://vmsingle-victoriametrics-vmks.monitoring-vm.svc.cluster.local:8429"
          loki-enabled: false  # set true after adding the loki component
          # Sign in with Grafana's admin user; no Google Workspace or OAuth client needed.
          #   kubectl -n grafana port-forward svc/grafana 3000:80   -> http://localhost:3000
          #   kubectl -n grafana get secret grafana -o jsonpath='{.data.admin-password}' | base64 -d
          # Once Grafana has an HTTPS URL: set root-url to it and cookie-secure: true,
          # or switch to auth-mode: google with hosted-domain for team SSO.
          auth-mode: password
          root-url: "http://localhost:3000"
          cookie-secure: false
