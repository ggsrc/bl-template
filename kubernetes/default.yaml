# Optional components (cnpg, redis, paradedb, kafka, loki, otel-collector, n9e, uptrace, bytebase, juicefs, navigation)
# are registered in kubernetes/config.yaml but NOT enabled here.
# Add them under projects[].components in your args file when needed.

version: 1.0.0
global: {}
projects:
  - name: prd
    components:
      - name: 0-external-secrets-operator
        parameters:
          namespace: external-secrets
          release-name: external-secrets
          replica-count: 1
          min-helm-version: "v3.18.4"
          min-kubectl-version: "1.24"
      - name: 0-external-secrets
        parameters:
          namespace: external-secrets
          project-id: prd
          secret-manager-service-account-email: sa-sm-accessor@prd.iam.gserviceaccount.com
          service-account-name: external-secrets-sa
      - name: 0-sealed-secret
        parameters:
          namespace: sealed-secret
      - name: 1-istio
        parameters:
          namespace: istio
          istio-version: 1.31.3
          istio-namespace: istio
      - name: 2-argocd
        parameters:
          namespace: argocd
          argocd-url: https://internal.example.com/argocd
          argocd-version: v3.5.6
          GitAuthMethod: github-app
          GitHubAppID: ""  # required: install refuses to run without it
          GitHubAppInstallationID: ""  # required
          GitHubAppCredsURL: https://github.com/example-org
          dex-config:
            connectors:
              - type: github
                id: github
                name: GitHub
                config:
                  clientID: XXXXXXX
                  orgs:
                    - name: example-org
          RBACPolicies:
            - policy: "p, role:org-admin, applications, *, apps/*, allow"
            - policy: "p, role:org-admin, logs, get, apps/*, allow"
            - policy: "p, role:org-admin, projects, get, apps, allow"
            - policy: "p, role:org-admin, clusters, get, *, allow"
            - policy: "p, role:org-admin, repositories, get, *, allow"
            - policy: "p, role:org-backend, applications, get, apps/*, allow"
            - policy: "p, role:org-backend, applications, sync, apps/*, allow"
            - policy: "p, role:org-backend, applications, action/*, apps/*, allow"
            - policy: "p, role:org-backend, logs, get, apps/*, allow"
          RBACRoleBindings:
            - group: "example-org:Infra"
              role: "role:org-admin"
            - group: "example-org:backend"
              role: "role:org-backend"
      - name: 3-victoria-metrics-operator
        parameters:
          namespace: monitoring-vm
          release-name: victoriametrics
          cluster: prd
          env: prd
          remote-write-url: "http://10.10.0.8:8480/insert/0/prometheus/api/v1/write"
          vmagent-cpu-limit: "3"
          vmagent-memory-limit: "2Gi"
          vmagent-cpu-request: "1500m"
          vmagent-memory-request: "1Gi"
      - name: 4-victoria-metrics
        parameters:
          namespace: monitoring-vm
          alert-cluster: prd
