{{- $data := include "uptrace.bootstrap" . | fromJson -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-bootstrap" .Release.Name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
{{- range $key, $value := $data }}
  {{ $key }}: {{ $value | b64enc | quote }}
{{- end }}
