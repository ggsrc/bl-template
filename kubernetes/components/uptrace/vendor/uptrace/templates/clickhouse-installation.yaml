{{- if .Values.clickhouse.enabled }}
apiVersion: 'clickhouse.altinity.com/v1'
kind: 'ClickHouseInstallation'

metadata:
  name: 'uptrace1'

spec:
  configuration:
    users:
      default/networks/ip: ['127.0.0.1', '::1']
      uptrace/password_sha256_hex: {{ index (include "uptrace.bootstrap" . | fromJson) "clickhouse-password" | sha256sum }}
      uptrace/networks/ip:
        - {{ .Values.clickhouse.allowedCIDR | quote }}
    clusters:
      - name: 'uptrace1'
        layout:
          shardsCount: 1
          replicasCount: 1

  defaults:
    templates:
      podTemplate: pod-template
      dataVolumeClaimTemplate: data-volume-template
      logVolumeClaimTemplate: log-volume-template

  templates:
    podTemplates:
      - name: pod-template
        spec:
          automountServiceAccountToken: false
          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:25.3
              env:
                - name: CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS
                  value: 'true'
              volumeMounts:
                - name: bootstrap-configmap-volume
                  mountPath: /docker-entrypoint-initdb.d
          volumes:
            - name: bootstrap-configmap-volume
              configMap:
                name: clickhouse-bootstrap-configmap

    volumeClaimTemplates:
      - name: data-volume-template
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
      - name: log-volume-template
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
{{- end }}
