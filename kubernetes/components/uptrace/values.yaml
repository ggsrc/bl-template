uptrace:
  postgresql:
    imageName: ghcr.io/cloudnative-pg/postgresql:17.10
  ingress:
    enabled: false
  otelcol:
    enabled: false
  otelcolDaemonset:
    enabled: false
  clickhouse:
    image:
      repository: clickhouse/clickhouse-server
      tag: "25.3.14.14@sha256:b627d7a9bc0e0c1bac26cdbe9d2fc6316faa29c5d8a174f28f5abd57d0fa6ba2"
    allowedCIDR: "10.0.0.0/8"
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
  uptrace:
    image:
      repository: uptrace/uptrace
      tag: "2.0.1"
    replicaCount: 1
    config:
      pg:
        addr: ${PG_HOST}:5432
        user: ${PG_USER}
        password: ${PG_PASSWORD}
        database: ${PG_DATABASE}
      redis_cache:
        addrs: null
      ch_cluster:
        shards:
          - replicas:
              - addr: clickhouse-uptrace1:9000
                database: uptrace
                user: uptrace
                password: ${CH_PASSWORD}
      self_monitoring:
        disabled: true
networkPolicy:
  enabled: true
  ingress: []
  egress: []
  clickhouseEgress: []
  clickhouseOperatorIngress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: clickhouse-operator
      ports:
        - {protocol: TCP, port: 8123}
