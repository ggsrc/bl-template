{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-application" .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app: uptrace
  policyTypes: [Ingress, Egress]
  ingress: {{ toYaml .Values.networkPolicy.ingress | nindent 4 }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: uptrace-postgresql
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - podSelector:
            matchLabels:
              clickhouse.altinity.com/chi: uptrace1
      ports:
        - {protocol: TCP, port: 9000}
    {{- with .Values.networkPolicy.egress }}
    {{ toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-clickhouse" .Release.Name }}
spec:
  podSelector:
    matchLabels:
      clickhouse.altinity.com/chi: uptrace1
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: uptrace
      ports:
        - {protocol: TCP, port: 9000}
    # Altinity operator reconciliation uses HTTP. Keep it outside the UI namespace.
    {{- with .Values.networkPolicy.clickhouseOperatorIngress }}
    {{ toYaml . | nindent 4 }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- with .Values.networkPolicy.clickhouseEgress }}
    {{ toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
