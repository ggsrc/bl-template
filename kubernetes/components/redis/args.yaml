version: 1.0.0

# Parameter definitions for the kubernetes/components/redis component
# Shared Valkey (Redis-compatible) based on the official Valkey Helm chart.

parameters:
  components:
    redis:
      namespace:
        type: string
        description: "Namespace to install the shared Valkey"
        required: false
        default: "redis"
      releaseName:
        type: string
        description: "Helm release name"
        required: false
        default: "redis"
      valuesFiles:
        type: string
        description: "Space-separated values files. Use values.yaml values-override.yaml after rendering"
        required: false
        default: "values.yaml values-override.yaml"
      existingSecret:
        type: string
        description: "Kubernetes secret name containing the password (used by the default and metrics ACL users)"
        required: false
        default: "redis-shared"
      existingSecretPasswordKey:
        type: string
        description: "Key in existingSecret for the password"
        required: false
        default: "REDIS_PASSWORD"
      allowLuaScripting:
        type: boolean
        description: "Allow Lua scripting and functions (the @scripting ACL category: EVAL, EVALSHA, FUNCTION, FCALL, SCRIPT, ...) for the default user. Disabled by default; enable only for clients that need Lua (for example BullMQ or redlock)"
        required: false
        default: false
      extraAclRules:
        type: string
        description: "Extra ACL rules appended to the default user's permissions, for example \"+keys +sort\" (both are in @dangerous and denied by default)"
        required: false
        default: ""
      enableInternalLB:
        type: boolean
        description: "Deploy an internal LoadBalancer Service (GCP internal LB) for clients outside the cluster. Requires internalLBSourceRanges"
        required: false
        default: false
      internalLBServiceName:
        type: string
        description: "Name of internal LoadBalancer Service"
        required: false
        default: "redis-shared-lb"
      internalLBSourceRanges:
        type: string
        description: "Comma-separated client CIDRs allowed through the internal LoadBalancer (loadBalancerSourceRanges); required when enableInternalLB is true"
        required: false
        default: ""
      cpuLimit:
        type: string
        description: "Valkey container CPU limit"
        required: false
        default: "1000m"
      memoryLimit:
        type: string
        description: "Valkey container memory limit"
        required: false
        default: "500M"
      cpuRequest:
        type: string
        description: "Valkey container CPU request"
        required: false
        default: "150m"
      memoryRequest:
        type: string
        description: "Valkey container memory request"
        required: false
        default: "100M"
      minHelmVersion:
        type: string
        description: "Minimum helm version required by install script"
        required: false
        default: ""
      minKubectlVersion:
        type: string
        description: "Minimum kubectl version required by install script"
        required: false
        default: ""
