version: 1.0.0

# Parameter definitions for the kubernetes/components/external-secrets-operator component
# Deploys the External Secrets Operator (Helm); rendered by blcli

parameters:
  components:
    external-secrets-operator:
      namespace:
        type: string
        description: "Namespace to install the operator"
        required: false
        default: "external-secrets"
      releaseName:
        type: string
        description: "Helm release name"
        required: false
        default: "external-secrets"
      namespaceOverride:
        type: string
        description: "Helm chart namespaceOverride (overrides chart default)"
        required: false
        default: ""
      replicaCount:
        type: integer
        description: "Operator replica count"
        required: false
        default: 1
      imageTag:
        type: string
        description: "Operator image tag (empty = chart appVersion)"
        required: false
        default: ""
      # The install script checks that helm/kubectl are installed; if set, it also enforces these minimum versions
      minHelmVersion:
        type: string
        description: "Minimum helm version required by install script (e.g. 3.0). Empty = only check presence"
        required: false
        default: ""
      minKubectlVersion:
        type: string
        description: "Minimum kubectl version required by install script (e.g. 1.24). Empty = only check presence"
        required: false
        default: ""
