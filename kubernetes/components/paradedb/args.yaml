version: 1.0.0

parameters:
  components:
    paradedb:
      namespace:
        type: string
        required: false
        default: "paradedb"
      releaseName:
        type: string
        required: false
        default: "paradedb"
      valuesFiles:
        type: string
        required: false
        default: "values.yaml values-override.yaml"
      minHelmVersion:
        type: string
        required: false
        default: ""
      minKubectlVersion:
        type: string
        required: false
        default: ""
      instances:
        type: integer
        default: 1
      storageSize:
        type: string
        default: "20Gi"
      postgresqlVersion:
        type: string
        default: "17"
      paradedbVersion:
        type: string
        default: "0.15.11"
      enableSuperuserAccess:
        type: boolean
        description: "Allow network logins as the postgres superuser (CNPG generates the paradedb-superuser Secret). Default false"
        required: false
        default: false
      requireTLS:
        type: boolean
        description: "Reject PostgreSQL TCP connections that do not use TLS (adds pg_hba rule 'hostnossl all all all reject'). Clients must use sslmode=require or stricter; libpq's default 'prefer' also works. Default false"
        required: false
        default: false
