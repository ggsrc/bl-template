version: 1.0.0

# Parameter definitions for the kubernetes/components/victoria-metrics component
# Applies Victoria Metrics alert rules via kustomize

parameters:
  components:
    victoria-metrics:
      namespace:
        type: string
        description: "Namespace to apply alert rules (e.g. monitoring-vm)"
        required: false
        default: "monitoring-vm"
      alertCluster:
        type: string
        description: "Cluster matcher for alert route (e.g. prd, stg)"
        required: false
        default: "prd"
      slackSecretName:
        type: string
        description: "Secret name for Slack webhook URL"
        required: false
        default: "slack-webhook-url-infra-alert"
      slackSecretKey:
        type: string
        description: "Secret key for Slack webhook URL"
        required: false
        default: "url"
      slackChannel:
        type: string
        description: "Slack channel for alerts"
        required: false
        default: "#infra-alert"
      kustomizeDir:
        type: string
        description: "Path to kustomization directory (default: current dir .)"
        required: false
        default: "."
      # The install script checks that kubectl is installed; if set, it also enforces this minimum version
      minKubectlVersion:
        type: string
        description: "Minimum kubectl version required by install script (e.g. 1.24). Empty = only check presence"
        required: false
        default: ""
