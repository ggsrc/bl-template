version: 1.0.0

# Parameter definitions for the kubernetes/components/external-secrets component

parameters:
  # Component-level parameters
  components:
    external-secrets:
      description: "External Secrets Operator configuration parameters"
      
      # Basic configuration
      Namespace:
        type: string
        description: "External Secrets namespace"
        required: false
        default: "external-secrets"
        example: "external-secrets"
      
      # GCP Secret Manager configuration
      project_id:
        type: string
        description: "GCP Project ID where secrets are stored"
        required: true
        example: "prd"
      
      SecretManagerServiceAccountEmail:
        type: string
        description: "GCP Service Account email with Secret Manager access (format: sa-name@project-id.iam.gserviceaccount.com)"
        required: true
        example: "sa-sm-accessor@prd.iam.gserviceaccount.com"
      
      # ServiceAccount configuration
      ServiceAccountName:
        type: string
        description: "Kubernetes ServiceAccount name for GCP Secret Manager access"
        required: false
        default: "gcp-secret-manager"
        example: "gcp-secret-manager"
      
      # ClusterSecretStore configuration
      ClusterSecretStoreName:
        type: string
        description: "ClusterSecretStore resource name"
        required: false
        default: "gcp-secret-store"
        example: "gcp-secret-store"
      
      # Namespaces allowed to use the ClusterSecretStore
      # Any namespace labelled gcp-secret-store-access=allowed may use the store.
      # Namespaces listed here may use it as well, without the label.
      AllowedNamespaces:
        type: array
        description: "Namespaces allowed to use the ClusterSecretStore by name, in addition to namespaces labelled gcp-secret-store-access=allowed. The defaults are the namespaces of the grafana, victoria-metrics and web-ide components."
        required: false
        default: ["grafana", "monitoring-vm", "webide"]
        example: ["grafana", "monitoring-vm", "webide"]

      # GKE Workload Identity configuration
      ClusterLocation:
        type: string
        description: "GKE cluster location (region or zone)"
        required: false
        default: "us-west1"
        example: "us-west1"
      
      ClusterName:
        type: string
        description: "GKE cluster name"
        required: false
        default: "app"
        example: "prd-cluster"
      
      # Namespace labels
      NamespaceLabels:
        type: map[string]string
        description: "Labels to add to External Secrets namespace"
        required: false
        default:
          istio-injection: "enabled"
        example:
          istio-injection: "enabled"
          prometheus.io/scrape: "true"

