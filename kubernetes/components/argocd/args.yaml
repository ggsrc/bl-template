version: 1.0.0

# Parameter definitions for the kubernetes/components/argocd component

parameters:
  # Component-level parameters
  components:
    argocd:
      description: "ArgoCD GitOps configuration parameters"
      
      # Basic configuration
      Namespace:
        type: string
        description: "ArgoCD namespace"
        required: false
        default: "argocd"
        example: "argocd"

      AppNamespace:
        type: string
        description: "Application runtime namespace to create alongside ArgoCD"
        required: false
        default: "app"
        example: "app"
      
      ArgoCDVersion:
        type: string
        description: "ArgoCD release whose manifests/install.yaml is installed. The install script only applies a manifest whose sha256 matches: the template carries the digest for the default version; for any other version set ArgoCDManifestSHA256"
        required: false
        default: "v3.5.6"
        example: "v3.5.6"

      ArgoCDManifestSHA256:
        type: string
        description: "sha256 of the install manifest. Leave empty to use the digest pinned for the default ArgoCDVersion; required when ArgoCDVersion or ArgoCDManifestURL is changed (the install script prints the digest it downloaded)"
        required: false
        default: ""
        example: "846c644bc81ce5557dd9048757a9c7353378f25c5eb811c77d32a9e907823599"
      
      # Server configuration
      ServerInsecure:
        type: boolean
        description: "Enable insecure mode for ArgoCD server (for development/testing)"
        required: false
        default: true
        example: true
      
      ServerBaseHref:
        type: string
        description: "Base href path for ArgoCD server UI"
        required: false
        default: "/argocd"
        example: "/argocd"
      
      ServerRootPath:
        type: string
        description: "Root path for ArgoCD server"
        required: false
        default: "/argocd"
        example: "/argocd"
      
      # RBAC configuration
      PolicyDefault:
        type: string
        description: "Default RBAC role for users who match no RBACRoleBindings group. Empty (default) = no access; role:readonly lets every user who can log in read every application, including its manifests"
        required: false
        default: ""
        example: "role:readonly"

      AdminEnabled:
        type: boolean
        description: "Enable the local admin account. Off by default: sign in through Dex SSO; for break-glass access use kubectl (argocd admin, port-forward) or enable it temporarily. The install script refuses to run with it off and no Dex connector configured"
        required: false
        default: false
        example: false

      # AppProject configuration
      AppProjectName:
        type: string
        description: "AppProject for the GitOps applications: sources limited to the GitOps repositories, destinations to the application namespace, no cluster-scoped resources. Must match the gitops Project/ApplicationProject"
        required: false
        default: "apps"
        example: "apps"

      AppProjectSourceRepos:
        type: list[string]
        description: "Repository URLs the AppProject may deploy from. Empty = the configured GitRepositories (or GitRepositoryURL)"
        required: false
        default: []
        example:
          - "git@github.com:example-org/gitops.git"

      AppProjectNamespaces:
        type: list[string]
        description: "Namespaces on the local cluster the AppProject may deploy to. Empty = AppNamespace"
        required: false
        default: []
        example:
          - "app"

      RestrictDefaultProject:
        type: boolean
        description: "Empty the built-in default AppProject (no sources, destinations or resources), so applications must use AppProjectName. Set false while existing applications still use the default project: the install script then restores the default project to what ArgoCD creates (all sources, destinations and resources), also after it was emptied"
        required: false
        default: true
        example: true
      
      RBACScopes:
        type: string
        description: "OIDC scopes to examine during RBAC enforcement"
        required: false
        default: "[groups]"
        example: "[groups]"
      
      # Organization configuration
      OrganizationName:
        type: string
        description: "Organization name used in RBAC policies (e.g., example-org)"
        required: false
        default: ""
        example: "example-org"
      
      # RBAC roles and policies
      RBACPolicies:
        type: list[object]
        description: "Custom RBAC policies in CSV format. If not provided, the defaults are used: role:org-admin manages applications in AppProjectName and reads clusters and repositories; role:org-backend can view, sync and run actions on them"
        required: false
        default: []
        example:
          - policy: "p, role:org-admin, applications, *, apps/*, allow"
          - policy: "p, role:org-admin, logs, get, apps/*, allow"
          - policy: "p, role:org-admin, projects, get, apps, allow"
          - policy: "p, role:org-admin, clusters, get, *, allow"
          - policy: "p, role:org-admin, repositories, get, *, allow"
          - policy: "p, role:org-backend, applications, get, apps/*, allow"
          - policy: "p, role:org-backend, applications, sync, apps/*, allow"
          - policy: "p, role:org-backend, applications, action/*, apps/*, allow"
          - policy: "p, role:org-backend, logs, get, apps/*, allow"
      
      RBACRoleBindings:
        type: list[object]
        description: "RBAC role bindings mapping groups to roles. If not provided, no role bindings will be configured."
        required: false
        default: []
        example:
          - group: "example-org:Infra"
            role: "role:org-admin"
          - group: "example-org:backend"
            role: "role:org-backend"
      
      # Namespace labels
      NamespaceLabels:
        type: map[string]string
        description: "Labels to add to ArgoCD namespace"
        required: false
        default:
          prometheus.io/scrape: "true"
          prometheus.io/port: "8080"
        example:
          prometheus.io/scrape: "true"
          prometheus.io/port: "8080"
          istio-injection: "enabled"
      
      # Git repository configuration
      GitRepositories:
        type: list[object]
        description: "Git repositories for ArgoCD. gen_ssh_sealed_secrets.sh seals one repository Secret per entry (url, type, name and the SSH key, label argocd.argoproj.io/secret-type=repository); sshPrivateKeySecret.name names that Secret (default GitSSHSecretName-<index>). sshPrivateKeyFile is the entry's own private key, relative to the keys directory (default <workspace>/keys); without it the default key argocd_github is used. A GitHub deploy key reads only one repository, so give every entry its own key unless the default key belongs to a machine user"
        required: false
        default: []
        example:
          - url: "git@github.com:example-org/gitops.git"
            sshPrivateKeySecret:
              name: "argocd-github-ssh-secret"
            sshPrivateKeyFile: "argocd_github"
            name: "gitops"
            type: "git"
      
      GitRepositoryURL:
        type: string
        description: "Git repository URL (used when GitRepositories is not provided, for backward compatibility)"
        required: false
        default: "git@github.com:example-org/gitops.git"
        example: "git@github.com:example-org/gitops.git"
      
      GitSSHSecretName:
        type: string
        description: "Name of the repository Secret (URL + SSH key) that gen_ssh_sealed_secrets.sh seals for GitRepositoryURL"
        required: false
        default: "argocd-github-ssh-secret"
        example: "argocd-github-ssh-secret"
      
      # ArgoCD URL configuration
      ArgoCDURL:
        type: string
        description: "External URL for ArgoCD server"
        required: false
        default: ""
        example: "https://internal.example.com/argocd"
      
      # Dex OIDC configuration
      DexConfig:
        type: object
        description: "Complete Dex configuration with connectors. Do not put the client secret here: argocd-cm references it as $<DexClientSecretName>:<DexClientSecretKey> (or the connector's clientSecretRef), and gen_dex_sealed_secret.sh seals it. Every github connector must list config.orgs, or the install script refuses to apply"
        required: false
        default: {}
        example:
          connectors:
            - type: "github"
              id: "github"
              name: "GitHub"
              config:
                clientID: "Ov23xxxxxxxxxxxxxxx"
                orgs:
                  - name: "your-org"
      
      DexGitHubEnabled:
        type: boolean
        description: "Enable GitHub Dex connector (used when DexConfig is not provided)"
        required: false
        default: false
        example: true
      
      DexGitHubClientID:
        type: string
        description: "GitHub OAuth Client ID for Dex"
        required: false
        default: ""
        example: "Ov23xxxxxxxxxxxxxxx"
      
      DexClientSecretName:
        type: string
        description: "Secret in the ArgoCD namespace that holds the GitHub OAuth client secret for Dex (labelled app.kubernetes.io/part-of=argocd; created by gen_dex_sealed_secret.sh or an ExternalSecret)"
        required: false
        default: "argocd-dex-github"
        example: "argocd-dex-github"

      DexClientSecretKey:
        type: string
        description: "Key of the GitHub OAuth client secret inside DexClientSecretName"
        required: false
        default: "clientSecret"
        example: "clientSecret"
      
      DexGitHubOrgs:
        type: list[string]
        description: "GitHub organizations allowed to log in through Dex. Required when the GitHub connector is enabled: without it any GitHub account can log in, so the install script refuses to apply"
        required: false
        default: []
        example:
          - "your-org"
      
      # Kustomization configuration
      ArgoCDManifestURL:
        type: string
        description: "Override the install manifest URL (default: manifests/install.yaml of ArgoCDVersion on raw.githubusercontent.com). Requires ArgoCDManifestSHA256"
        required: false
        default: ""
        example: "https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.6/manifests/install.yaml"
      
      # Patch configuration
      Patches:
        type: list[string]
        description: "List of patch files to apply to ArgoCD resources"
        required: false
        default:
          - "argocd-cm.yaml"
        example:
          - "argocd-cm.yaml"
          - "argocd-rbac-cm.yaml"
