{{- $data := include "n9e.bootstrap" . | fromJson -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nightingale.database" . }}
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ index $data "mysql-root-password" | quote }}
  MYSQL_ROOT_HOST: localhost
  MYSQL_USER: n9e
  MYSQL_PASSWORD: {{ index $data "mysql-password" | quote }}
  MYSQL_DATABASE: n9e_v6
