nightingale:
  expose:
    type: clusterIP
  n9e:
    type: internal
    internal:
      image:
        repository: flashcatcloud/nightingale
        tag: "9.1.1"
  database:
    type: internal
    internal:
      username: n9e
      image:
        repository: mysql
        tag: "8.4.13"
  redis:
    type: internal
    internal:
      image:
        repository: redis
        tag: "7.4.12-alpine"
  categraf:
    type: external
  prometheus:
    type: external
networkPolicy:
  enabled: true
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring-vm
      ports:
        - {protocol: TCP, port: 8429}
