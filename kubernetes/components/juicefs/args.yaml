version: 1.0.0
parameters:
  components:
    juicefs:
      namespace:
        type: string
        default: "juicefs"
      gatewayImageRepository:
        type: string
        default: "juicedata/mount"
      gatewayImageTag:
        type: string
        default: "ce-v1.3.1"
      formatImageRepository:
        type: string
        default: "juicedata/mount"
      formatImageTag:
        type: string
        default: "ce-v1.3.1"
      bucket:
        type: string
        default: "s3://example-bucket"
      storageType:
        type: string
        default: "s3"
      volumeName:
        type: string
        default: "juicefs-vol"
      gcpServiceAccountEmail:
        type: string
        default: ""
      # Credentials come from GCP Secret Manager through the juicefs-secret ExternalSecret.
      secretStoreName:
        type: string
        description: "ClusterSecretStore used by the juicefs-secret ExternalSecret"
        default: "gcp-secret-store"
      metaURLSecretName:
        type: string
        description: "Secret Manager secret holding the JuiceFS metadata engine URL (for example postgres://USER:PASSWORD@HOST:5432/juicefs?sslmode=require)"
        default: "juicefs-metaurl"
      gatewayAccessKeySecretName:
        type: string
        description: "Secret Manager secret holding the S3 gateway access key"
        default: "juicefs-gateway-access-key"
      gatewaySecretKeySecretName:
        type: string
        description: "Secret Manager secret holding the S3 gateway secret key"
        default: "juicefs-gateway-secret-key"
      storageClassName:
        type: string
        default: "juicefs-sc"
      replicas:
        type: integer
        default: 1
