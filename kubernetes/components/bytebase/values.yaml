# Default values for bytebase.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

bytebase:
  version: "3.24.0"
  registryMirrorHost: ""
  option:
    port: 8080
    data: "/var/opt/bytebase"
    external-url: "https://bytebase.example.com"
    externalPg:
      existingPgURLSecret: ""
      existingPgURLSecretKey: uri
  persistence:
    enabled: true
    existingClaim: ""
    storage: 20Gi
    storageClass: "standard-rwo"
    finalizers:
      - kubernetes.io/pvc-protection
  resources: {}
#    limits:
#      cpu: 2000m
#      memory: 4Gi
#    requests:
#      cpu: 1000m
#      memory: 1Gi

  # Additional Bytebase secret mounts
  # Defines additional mounts with secret. Secret must be manually created in the namespace.
  extraSecretMounts:
    []
    # - name: secrets-store-inline
    #   mountPath: "/mnt/secrets-store"
    #   readOnly: true # Only required when using service principal mode
  # Additional Bytebase Volume, name prefix with "bytebase-" should be avoided.
  extraVolumes:
    []
    # - name: secrets-store-inline
    #   csi:
    #     driver: secrets-store.csi.k8s.io
    #     readOnly: true
    #     volumeAttributes:
    #       secretProviderClass: akv-bytebase-spc
    #     # Only required when using service principal mode
    #     nodePublishSecretRef:
    #       # Only required when using service principal mode, usually is the secret store the service principal's credentials
    #       name: secrets-store-creds

# Requires the cnpg operator; its generated application role has no superuser access.
metadataDatabase:
  enabled: true
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.10
  storage: 20Gi

# No incoming connections until bootstrap has been completed through port-forward.
networkPolicy:
  enabled: true
  ingress: []
  egress: []
