{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bytebase
  namespace: {{ include "bytebase.namespace" . }}
spec:
  podSelector:
    matchLabels:
      app: bytebase
  policyTypes: [Ingress, Egress]
  ingress: {{ toYaml .Values.networkPolicy.ingress | nindent 4 }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- if .Values.metadataDatabase.enabled }}
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: {{ printf "%s-postgresql" .Release.Name }}
      ports:
        - {protocol: TCP, port: 5432}
    {{- end }}
    {{- with .Values.networkPolicy.egress }}
    {{ toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
