{{- $bb := .Values.bytebase -}}
{{- $pg := $bb.option.externalPg -}}
{{- if not (semverCompare ">=3.24.0" (toString $bb.version)) -}}
{{- fail "Bytebase requires >=3.24.0; review SECURITY.md before migrating older data" -}}
{{- end -}}
{{- if and (not .Values.metadataDatabase.enabled) (not $pg.existingPgURLSecret) -}}
{{- fail "provide externalPg.existingPgURLSecret or enable metadataDatabase; embedded PostgreSQL is disabled" -}}
{{- end -}}
{{- if or $pg.url $pg.pgPassword $pg.escapePassword $pg.enable $pg.pgHost $pg.pgPort $pg.pgUsername $pg.existingPgPasswordSecret -}}
{{- fail "inline/escaped metadata credentials are disabled; use externalPg.existingPgURLSecret" -}}
{{- end -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bytebase
  namespace: {{ include "bytebase.namespace" . }}
  labels:
    {{- include "bytebase.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: bytebase
  selector:
    matchLabels:
      app: bytebase
  template:
    metadata:
      labels:
        app: bytebase
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 113
        runAsGroup: 113
        fsGroup: 113
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bytebase
          image: {{ printf "%s/bytebase/bytebase:%s" (trimSuffix "/" $bb.registryMirrorHost) (toString $bb.version) | trimPrefix "/" | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          command: [bytebase]
          args:
            - --data
            - {{ $bb.option.data | quote }}
            - --port
            - {{ $bb.option.port | quote }}
            - --external-url
            - {{ index $bb.option "external-url" | quote }}
          env:
            - name: HOME
              value: /tmp
            - name: PG_URL
              valueFrom:
                secretKeyRef:
                  {{- if .Values.metadataDatabase.enabled }}
                  name: {{ printf "%s-postgresql-app" .Release.Name }}
                  key: uri
                  {{- else }}
                  name: {{ $pg.existingPgURLSecret | quote }}
                  key: {{ required "existingPgURLSecretKey is required" $pg.existingPgURLSecretKey | quote }}
                  {{- end }}
          ports:
            - containerPort: {{ $bb.option.port }}
              name: web
          {{- with $bb.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: web
            failureThreshold: 120
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: web
          livenessProbe:
            httpGet:
              path: /healthz
              port: web
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: {{ $bb.option.data | quote }}
              name: bytebase-volume
            {{- with $bb.extraSecretMounts }}
            {{ toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: bytebase-volume
          {{- if $bb.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default "bytebase-volume" $bb.persistence.existingClaim | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with $bb.extraVolumes }}
        {{ toYaml . | nindent 8 }}
        {{- end }}
{{- if and $bb.persistence.enabled (not $bb.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bytebase-volume
  namespace: {{ include "bytebase.namespace" . }}
  labels:
    {{- include "bytebase.labels" . | nindent 4 }}
spec:
  {{- if $bb.persistence.storageClass }}
  storageClassName: {{ $bb.persistence.storageClass | quote }}
  {{- end }}
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ $bb.persistence.storage | quote }}
{{- end }}
