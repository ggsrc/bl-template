version: 1.0.0

# Parameter definitions for the kubernetes/components/grafana component
# Typical variables: image.tag, grafana.ini.server.root_url, datasources, plugins, auth.google

parameters:
  components:
    grafana:
      namespace:
        type: string
        description: "Namespace to install Grafana"
        required: false
        default: "grafana"
      releaseName:
        type: string
        description: "Helm release name"
        required: false
        default: "grafana"
      valuesFiles:
        type: string
        description: "Space-separated values files. Use values.yaml values-corp.yaml after rendering values-corp.yaml.tmpl"
        required: false
        default: "values.yaml values-corp.yaml"
      # Parameters for rendering values-corp.yaml.tmpl
      imageTag:
        type: string
        description: "Grafana image tag"
        required: false
        default: "12.4.13"
      replicas:
        type: integer
        description: "Grafana replica count"
        required: false
        default: 1
      persistenceSize:
        type: string
        description: "PVC size for Grafana persistence"
        required: false
        default: "10Gi"
      vmDatasourceUrl:
        type: string
        description: "VictoriaMetrics datasource URL (Prometheus endpoint)"
        required: false
        default: "http://vmselect-victoriametrics-vmks.monitoring-vm.svc.cluster.local:8481/select/0/prometheus"
      lokiDatasourceUrl:
        type: string
        description: "Loki datasource URL"
        required: false
        default: "http://loki-gateway.loki.svc.cluster.local"
      rootUrl:
        type: string
        description: "Grafana server root_url (e.g. https://example.com/grafana)"
        required: false
        default: "https://example.com/grafana"
      hostedDomain:
        type: string
        description: "Google Workspace (or Cloud Identity) domain allowed to sign in. Rendered as auth.google hosted_domain and allowed_domains: only accounts whose e-mail is in this domain can log in"
        required: false
        default: "example.com"
      allowedGroups:
        type: string
        description: "Optional space-separated Google group e-mails; when set, users must belong to one of them (auth.google allowed_groups, read with the cloud-identity groups scope)"
        required: false
        default: ""
        example: "grafana-users@example.com"
      # The install script checks that helm/kubectl are installed; if set, it also enforces these minimum versions
      minHelmVersion:
        type: string
        description: "Minimum helm version required by install script (e.g. 3.0). Empty = only check presence"
        required: false
        default: ""
      minKubectlVersion:
        type: string
        description: "Minimum kubectl version required by install script (e.g. 1.24). Empty = only check presence"
        required: false
        default: ""
