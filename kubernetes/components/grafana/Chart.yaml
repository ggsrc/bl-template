apiVersion: v2
name: grafana
version: "1.0.0"
dependencies:
  - name: grafana
    # https://github.com/grafana-community/helm-charts/tree/main/charts/grafana
    # (the chart moved there from grafana/helm-charts in January 2026).
    # 11.6.1 is the last chart line for Grafana 12. install runs `helm dependency build`,
    # which only accepts the version in Chart.lock, and checks the chart's sha256.
    version: 11.6.1
    repository: oci://ghcr.io/grafana-community/helm-charts
