version: 1.0.0

# Parameter definitions for the kubernetes/components/victoria-metrics-operator component
# Per-environment values are rendered into values-override.yaml.tmpl.
# Typical differences: storageMode, cluster/env (externalLabels), remoteWrite URL, vmagent resources

parameters:
  components:
    victoria-metrics-operator:
      namespace:
        type: string
        description: "Namespace to install Victoria Metrics K8s Stack"
        required: false
        default: "monitoring-vm"
      releaseName:
        type: string
        description: "Helm release name"
        required: false
        default: "victoriametrics"
      valuesFiles:
        type: string
        description: "Space-separated values files. Use values.yaml values-override.yaml when using rendered override"
        required: false
        default: "values.yaml values-override.yaml"
      # Parameters for rendering values-override.yaml.tmpl
      storageMode:
        type: string
        description: "Where metrics are stored. local: VMSingle + VMAlert + VMAlertmanager in this cluster (self-contained, for a single environment). remote: this cluster only scrapes and ships metrics to remoteWriteUrl (a central VictoriaMetrics cluster that also runs alerting)"
        required: false
        default: "local"
        enum: ["local", "remote"]
      retentionPeriod:
        type: string
        description: "VMSingle retention period (storageMode=local only), e.g. 30d, 12w, 1y"
        required: false
        default: "30d"
      storageSize:
        type: string
        description: "VMSingle persistent volume size (storageMode=local only)"
        required: false
        default: "20Gi"
      cluster:
        type: string
        description: "Cluster label for vmagent externalLabels (e.g. stg, prd)"
        required: false
        default: "prd"
      env:
        type: string
        description: "Env label for vmagent externalLabels"
        required: false
        default: "prd"
      remoteWriteUrl:
        type: string
        description: "VMAgent remote write URL, used only when storageMode=remote (e.g. http://vminsert:8480/insert/0/prometheus/api/v1/write)"
        required: false
        default: "http://10.10.0.8:8480/insert/0/prometheus/api/v1/write"
      scrapeInterval:
        type: string
        description: "VMAgent scrape interval"
        required: false
        default: "20s"
      vmagentCpuLimit:
        type: string
        description: "VMAgent resources limits cpu"
        required: false
        default: "2"
      vmagentMemoryLimit:
        type: string
        description: "VMAgent resources limits memory"
        required: false
        default: "2Gi"
      vmagentCpuRequest:
        type: string
        description: "VMAgent resources requests cpu"
        required: false
        default: "500m"
      vmagentMemoryRequest:
        type: string
        description: "VMAgent resources requests memory"
        required: false
        default: "500Mi"
      # The install script checks that helm/kubectl are installed; if set, it also enforces these minimum versions
      minHelmVersion:
        type: string
        description: "Minimum helm version required by install script (e.g. 3.0). Empty = only check presence"
        required: false
        default: ""
      minKubectlVersion:
        type: string
        description: "Minimum kubectl version required by install script (e.g. 1.24). Empty = only check presence"
        required: false
        default: ""
