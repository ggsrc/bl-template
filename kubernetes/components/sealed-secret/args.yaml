version: 1.0.0

# Parameter definitions for the kubernetes/components/sealed-secret component

parameters:
  # Component-level parameters
  components:
    sealed-secret:
      description: "Sealed Secrets controller configuration parameters"
      
      # Basic configuration
      Namespace:
        type: string
        description: "Namespace where Sealed Secrets controller is deployed (typically kube-system)"
        required: false
        default: "kube-system"
        example: "kube-system"
      
      # Version configuration (informational)
      # The controller manifest is vendored as controller.yaml in this component;
      # the version is changed by replacing that file, not by an argument.
      SealedSecretsVersion:
        type: string
        description: "Version of the vendored Sealed Secrets controller manifest (informational; replace controller.yaml to upgrade)"
        required: false
        default: "v0.40.0"
        example: "v0.40.0"
      
      # Controller configuration
      ControllerName:
        type: string
        description: "Sealed Secrets controller name"
        required: false
        default: "sealed-secrets-controller"
        example: "sealed-secrets-controller"
      
      # Resource limits (optional, to customize controller resources)
      ControllerResources:
        type: object
        description: "Resource requests and limits for Sealed Secrets controller"
        required: false
        default: {}
        example:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
      
      # Replica count
      ControllerReplicas:
        type: integer
        description: "Number of controller replicas (for HA setup)"
        required: false
        default: 1
        minimum: 1
        example: 1
      
      # Update strategy
      UpdateStrategy:
        type: string
        description: "Update strategy for controller deployment (RollingUpdate, Recreate)"
        required: false
        default: "RollingUpdate"
        enum: ["RollingUpdate", "Recreate"]
        example: "RollingUpdate"

