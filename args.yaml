version: 1.0.0

# Repository-level global parameter definitions for bl-template
# These parameters apply to every module in the template repository (terraform, kubernetes, gitops)

# Top-level validation: the set of values at each path must be unique
validation:
  unique:
    - path: "terraform.projects[].name"
      message: "Project names must be unique"

parameters:
  # Repository-level global parameters
  global:
    GlobalName:
      type: string
      description: "Global name used for resource naming (e.g., for backend bucket)"
      required: true
      example: "my-org"


