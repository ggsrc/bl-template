name: blcli validate

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: this workflow only checks out code and runs blcli.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to full commit SHAs (version in the comment).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Checkout blcli
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ggsrc/blcli
          path: blcli
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: blcli/go.mod
          cache-dependency-path: blcli/go.sum

      - name: Install blcli
        working-directory: blcli
        run: go install ./cmd/blcli

      - name: Preview and validate template defaults
        run: |
          blcli init-args "$GITHUB_WORKSPACE" -o /tmp/args.yaml --preview
          blcli init-args "$GITHUB_WORKSPACE" -o /tmp/args.yaml
          blcli check args --args /tmp/args.yaml -r "$GITHUB_WORKSPACE"

      - name: ArgoCD render and install-guard tests (fake kubectl, no network)
        run: |
          python3 -m venv /tmp/test-venv
          /tmp/test-venv/bin/pip install PyYAML==6.0.3
          /tmp/test-venv/bin/python scripts/test-argocd.py
